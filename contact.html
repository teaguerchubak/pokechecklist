<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teaguer's Pokemon Card Tracker</title>
    <meta name="author" content="Teaguer Chubak">
    <meta name="description" content="A checklist for tracking Pokemon card collections.">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/contact.css">
    <script type="module" src="js/base.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Zalando+Sans+SemiExpanded:ital,wght@0,200..900;1,200..900&family=Zalando+Sans:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">

</head>

<body>
    <header>
        <div class="header-box">
            <h1 class="title">Pokemon Card Tracker</h1>
            <button type="button" class="menu-toggle">&#9776;</button>
        </div>
        
        <nav class="menu">
            <a href="index.html">Home</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <h2>Contact:</h2>
        <form>
            <div class="first-name">
                <label for="first-name" class="txt">First name:</label>
                <input type="text" id="first-name" name="first-name" placeholder="John">
            </div>

            <div class="last-name">
                <label for="last-name" class="txt">Last name:</label>
                <input type="text" id="last-name" name="last-name" placeholder="Smith">
            </div>
        
            <div class="email">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="123name@email.com" required>
            </div>

            <div class="comment">
                <label for="comment">Comment:</label>
                <textarea id="comment" name="comment" placeholder="Add your comment here."></textarea>
            </div>

            <input type="submit" value="Submit" class="submit">
        </form>
    </main>

    <footer>
        <p>Teaguer Chubak</p>
        <div class="spacer"></div>
        <p>Website created for a school project.</p>
    </footer>
</body>

</html>
